name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded workflow runs on the same ref (a push to a PR
# branch cancels the older PR's in-flight jobs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept at the current Node.js LTS. Update alongside `engines` if / when added.
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------
  # Lint, typecheck, unit tests, build.
  # Runs on every push and PR.
  # ---------------------------------------------------------------
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Tests mock YouTube API calls — no real key needed.
        env:
          YOUTUBE_API_KEY: test-key
        run: npm run test

      - name: Build
        # The build must succeed without a real API key. Config values that
        # are strictly required at runtime are read lazily, not at build.
        env:
          YOUTUBE_API_KEY: build-time-placeholder
          NEXT_PUBLIC_SITE_URL: https://creator-earnings.example
        run: npm run build

  # ---------------------------------------------------------------
  # Playwright end-to-end tests.
  #
  # Runs against `next dev` with `E2E_MOCK_MODE=1`. No real YouTube
  # API call is ever made — see `src/lib/e2eFixtures.ts` and the
  # webServer block in `playwright.config.ts`.
  # ---------------------------------------------------------------
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    env:
      YOUTUBE_API_KEY: e2e-mock-placeholder-not-a-real-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      E2E_MOCK_MODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the Playwright browsers by version so we don't
      # re-download ~120 MB on every job.
      - name: Get installed Playwright version
        id: pw-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache-hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload traces + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
